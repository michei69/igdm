[package]
name = "igdm"
description = "IG Direct — Instagram DM desktop client (Tauri 2 + React)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "igdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
instagrapi = { path = "../instagrapi" }
tokio = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
env_logger = "0.11"

# GTK clipboard for large payloads (arboard's Wayland fork fails to serve
# multi-hundred-KB offers on KDE, leaving an empty paste).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
