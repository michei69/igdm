[package]
name = "igdm"
description = "IG Direct — Instagram DM desktop client (Tauri 2 + React)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Embed `ui/dist` into the binary so `cargo run -p igdm` / `cargo build` work
# without a dev server. The Tauri CLI strips this feature for `tauri dev`
# (which needs `build.devUrl` for HMR) and re-adds it for `tauri build`, so
# both entry points keep working.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "igdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# 2.12 is the first release on tao 0.37, which fixes the forced client-side
# decorations on Wayland windows (tao-apps/tao#1046, tauri#12955, tauri#12685)
# that this repo used to vendor a patched tao for.
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
instagrapi = { path = "../instagrapi" }
tokio = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
env_logger = "0.11"

# GTK clipboard for large payloads (arboard's Wayland fork fails to serve
# multi-hundred-KB offers on KDE, leaving an empty paste).
# webkit2gtk is the webview itself: it enables `enable-media-stream` and
# auto-grants the microphone prompt (see `enable_media_capture` in lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
# Not used from code: tauri pulls `tray-icon` in with its AppIndicator backend,
# which on Linux never reports clicks (the panel opens the menu on any button),
# so the tray could not toggle the window. Enabling `ksni` here switches the
# crate to its pure-Rust StatusNotifierItem backend (cargo unifies the features
# and tray-icon then picks ksni, warning about the pair). It needs no GTK or
# libappindicator at runtime, and it is Linux-only so the other targets keep
# tauri's own configuration.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
