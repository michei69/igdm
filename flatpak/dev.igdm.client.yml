# Flatpak manifest for IG Direct.
#
# The module below consumes an already-built binary rather than compiling the
# Rust/React sources inside the sandbox: the `linux` job of
# .github/workflows/build.yml uploads the portable tarball produced by
# scripts/package-linux.sh (`bin/`, `share/` at the archive root), the flatpak
# job unpacks it into `flatpak/stage/`, and only the packaging happens here.
# That keeps this step offline (no crates.io or npm access) and byte-identical
# to the .deb.
#
#   scripts/build-flatpak.sh [target-triple]
#
# which is equivalent to:
#
#   scripts/package-linux.sh
#   mkdir -p flatpak/stage
#   tar -xzf dist/igdm-<ver>-linux-<arch>.tar.gz --strip-components=1 -C flatpak/stage
#   flatpak-builder --user --force-clean --disable-rofiles-fuse \
#     --repo=flatpak/repo flatpak/build-dir flatpak/dev.igdm.client.yml
#   flatpak build-bundle flatpak/repo igdm.flatpak dev.igdm.client stable
id: dev.igdm.client
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: igdm

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The attachment picker is a GTK dialog inside the sandbox (rfd's gtk3
  # backend, not the portal), so these are the only places the user can
  # choose a photo or video from.
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop
  # Tray icon: the app registers a StatusNotifierItem with the panel's watcher
  # and owns the item's well-known name, which carries the process id
  # (`org.kde.StatusNotifierItem-<pid>-<id>`), hence the wildcard. Without
  # these the tray cannot register inside the sandbox and the app falls back to
  # closing its window normally.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*

modules:
  - name: igdm
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/igdm /app/bin/igdm
      - install -Dm644 share/applications/dev.igdm.client.desktop /app/share/applications/dev.igdm.client.desktop
      # Flatpak exports the entry under the app id, so the icon it names has to
      # be installed under the app id too.
      - sed -i 's|^Icon=.*|Icon=dev.igdm.client|' /app/share/applications/dev.igdm.client.desktop
      - install -Dm644 share/icons/hicolor/32x32/apps/igdm.png /app/share/icons/hicolor/32x32/apps/dev.igdm.client.png
      - install -Dm644 share/icons/hicolor/128x128/apps/igdm.png /app/share/icons/hicolor/128x128/apps/dev.igdm.client.png
      - install -Dm644 "share/icons/hicolor/256x256@2/apps/igdm.png" /app/share/icons/hicolor/512x512/apps/dev.igdm.client.png
      - install -Dm644 share/metainfo/dev.igdm.client.metainfo.xml /app/share/metainfo/dev.igdm.client.metainfo.xml
    sources:
      - type: dir
        path: stage
