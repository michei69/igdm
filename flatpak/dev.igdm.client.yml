# Flatpak manifest for IG Direct.
#
# The module below consumes an already-built binary rather than compiling the
# Rust/React sources inside the sandbox: CI extracts the .deb produced by the
# `linux` job of .github/workflows/build.yml into `flatpak/stage/` and only the
# packaging happens here. That keeps the flatpak step offline (no crates.io or
# npm access needed) and byte-identical to the deb build.
#
#   mkdir -p flatpak/stage
#   dpkg-deb -x target/release/bundle/deb/*.deb flatpak/stage
#   flatpak-builder --user --force-clean --repo=flatpak/repo flatpak/build-dir flatpak/dev.igdm.client.yml
#   flatpak build-bundle flatpak/repo igdm.flatpak dev.igdm.client stable
id: dev.igdm.client
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: igdm

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # The attachment picker is a GTK dialog inside the sandbox (rfd's gtk3
  # backend, not the portal), so these are the only places the user can
  # choose a photo or video from.
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: igdm
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/igdm /app/bin/igdm
      - install -Dm644 "usr/share/applications/IG Direct.desktop" /app/share/applications/dev.igdm.client.desktop
      - sed -i 's|^Exec=.*|Exec=igdm|; s|^Icon=.*|Icon=dev.igdm.client|' /app/share/applications/dev.igdm.client.desktop
      - install -Dm644 usr/share/icons/hicolor/32x32/apps/igdm.png /app/share/icons/hicolor/32x32/apps/dev.igdm.client.png
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/igdm.png /app/share/icons/hicolor/128x128/apps/dev.igdm.client.png
      - install -Dm644 usr/share/icons/hicolor/256x256@2/apps/igdm.png /app/share/icons/hicolor/512x512/apps/dev.igdm.client.png
      - install -Dm644 dev.igdm.client.metainfo.xml /app/share/metainfo/dev.igdm.client.metainfo.xml
    sources:
      - type: dir
        path: stage
      - type: file
        path: dev.igdm.client.metainfo.xml
